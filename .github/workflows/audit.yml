# Weekly audit of the production dependencies of the backend: fails when `pnpm audit` reports a high or critical
# advisory. Dependabot skips major versions (.github/dependabot.yml), and its documentation does not say whether that
# also holds back security updates: this job makes sure a fix that needs a major version is still noticed.
# Development dependencies are left out (they never reach the image).
name: audit

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays, 06:41 UTC
  workflow_dispatch:
  pull_request:
    paths: ["backend/pnpm-lock.yaml", ".github/workflows/audit.yml"]

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [backend]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.folder }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
